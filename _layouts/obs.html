---
layout: default
---
<span class="post-date">
  {{Created: page['date created']}}
  <br>
  {{Modified: page['date modified']}}
</span>

{% if page.tags %}
    <div class="tags">
        Tags: 
	{% for tag in page.tags %}
            <span class="tag">{{ tag; }}</span>
        {% endfor %}
    </div>
{% endif %}

<article>
  {{ content }}
</article>
