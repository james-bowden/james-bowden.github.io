# Site settings
title:           "James Bowden"
description:     "Berkeley ML + Science"
author:          "James Bowden"
url:             "https://james-bowden.github.io"
baseurl:         ""

# Theme — loaded from GitHub, no fork required
remote_theme: just-the-docs/just-the-docs

# Plugins (all whitelisted on GitHub Pages)
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Build settings
markdown:        kramdown
highlighter:     rouge
permalink:       /:title

# Just the Docs configuration
# color_scheme: dark   # uncomment for dark mode; or define a custom scheme in _sass/color_schemes/
search_enabled:  true

# Files to exclude from Jekyll processing
exclude:
  - sync.py
  - TODO.md

# Default front-matter values
# Used to bulk-exclude large content sections from the sidebar nav
defaults:
  # Posts: use post layout and hide from sidebar
  - scope:
      path: "_posts"
    values:
      layout: post
      nav_exclude: true
      search_exclude: true
  # Poetry collection — large, navigated internally
  - scope:
      path: "pages/poetry"
    values:
      nav_exclude: true
      search_exclude: true
  # Anthology — navigated internally
  - scope:
      path: "pages/anthology"
    values:
      nav_exclude: true
      search_exclude: true
  # Blog and dailies — navigated internally
  - scope:
      path: "pages/blog"
    values:
      nav_exclude: true
      search_exclude: true
  - scope:
      path: "pages/dailies"
    values:
      nav_exclude: true
      search_exclude: true
  # Bytes — navigated internally
  - scope:
      path: "pages/bytes"
    values:
      nav_exclude: true
      search_exclude: true
  # Vault sub-sections — navigated via vault index
  - scope:
      path: "pages/vault/atomic"
    values:
      nav_exclude: true
  - scope:
      path: "pages/vault/lists"
    values:
      nav_exclude: true
  - scope:
      path: "pages/vault/misc"
    values:
      nav_exclude: true
  - scope:
      path: "pages/vault/javascripts"
    values:
      nav_exclude: true
