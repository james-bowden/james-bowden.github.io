<!-- MathJax v3 — renders LaTeX in vault/atomic pages and posts -->
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>

<!-- Font Awesome 6 Free — social icons in sidebar -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">

<!-- Replace JTD logo element with SVG (photo + curved name) + social icons -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var header = document.querySelector('.site-header');
    if (!header) return;

    // SVG: circular photo with "James Bowden" curved over the top.
    // viewBox: 280 wide x 295 tall.
    //   Photo circle: center (140,175) r=120 → top edge at y=55, bottom at y=295.
    //   Name arc:     center (140,175) r=133 → top of arc at y=42, just above photo rim.
    //   Path M 7,175 A 133,133 0 0,1 273,175 traces the upper semicircle (sweep CW,
    //   short arc) so startOffset="50%" lands at the topmost point (140,42).
    var svgHtml = '<svg class="sidebar-profile-svg" viewBox="0 0 280 295" xmlns="http://www.w3.org/2000/svg">'
      + '<defs>'
      + '<clipPath id="sbCircleClip"><circle cx="140" cy="175" r="120"/></clipPath>'
      + '<path id="sbNameArc" d="M 7,175 A 133,133 0 0,1 273,175" fill="none"/>'
      + '</defs>'
      + '<image href="/assets/img/ci_harbor_crop.jpeg" x="20" y="55" width="240" height="240"'
      + ' clip-path="url(#sbCircleClip)" preserveAspectRatio="xMidYMid slice"/>'
      + '<text font-size="17" font-weight="600" fill="#7253ed" font-family="inherit">'
      + '<textPath href="#sbNameArc" startOffset="50%" text-anchor="middle">James Bowden</textPath>'
      + '</text>'
      + '</svg>';

    var iconsHtml = '<div class="social-icons">'
      + '<a href="mailto:jcbowden@berkeley.edu" title="Email"><i class="fas fa-envelope"></i></a>'
      + '<a href="https://scholar.google.com/citations?user=lfSNrMUAAAAJ&hl=en&oi=ao" title="Google Scholar"><i class="fas fa-graduation-cap"></i></a>'
      + '<a href="https://www.linkedin.com/in/j-bowden/" title="LinkedIn"><i class="fab fa-linkedin"></i></a>'
      + '<a href="https://github.com/james-bowden" title="GitHub"><i class="fab fa-github"></i></a>'
      + '</div>';

    header.insertAdjacentHTML('afterbegin', svgHtml + iconsHtml);
  });
</script>
