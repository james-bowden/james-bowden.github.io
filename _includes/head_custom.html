<!-- MathJax v3 — renders LaTeX in vault/atomic pages and posts -->
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>

<!-- Font Awesome 6 Free — social icons in sidebar -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">

<!-- Replace JTD logo with SVG (circular photo + curved name) and social icons below -->
<script>
  function injectSidebar() {
    // Prefer the sidebar-specific header; fall back to any .site-header.
    var header = document.querySelector('.side-bar .site-header')
               || document.querySelector('.site-header');
    if (!header) return;
    // Guard against double-injection.
    if (header.dataset.sbInjected) return;
    header.dataset.sbInjected = '1';

    // SVG: circular photo with "James Bowden" arcing over the top.
    //
    // Geometry (viewBox 0 0 280 295):
    //   Photo circle  — center (140,175) r=120; top edge y=55, bottom y=295.
    //   Name arc      — center (140,175) r=133; top of arc y=42 (just outside photo rim).
    //   Arc path M 7,175 A 133,133 0 0,1 273,175 is the upper semicircle
    //   (short clockwise arc); startOffset="50%" lands exactly at the top (140,42).
    //
    // &amp; in href values because insertAdjacentHTML parses its argument as HTML.
    var svgHtml = '<svg class="sidebar-profile-svg" viewBox="0 0 280 295"'
      + ' xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">'
      + '<defs>'
      + '<clipPath id="sbCircleClip"><circle cx="140" cy="175" r="120"/></clipPath>'
      + '<path id="sbNameArc" d="M 7,175 A 133,133 0 0,1 273,175" fill="none"/>'
      + '</defs>'
      + '<image href="/assets/img/ci_harbor_crop.jpeg"'
      + ' xlink:href="/assets/img/ci_harbor_crop.jpeg"'
      + ' x="20" y="55" width="240" height="240"'
      + ' clip-path="url(#sbCircleClip)" preserveAspectRatio="xMidYMid slice"/>'
      + '<text font-size="17" font-weight="600" fill="#7253ed" font-family="inherit">'
      + '<textPath href="#sbNameArc" xlink:href="#sbNameArc" startOffset="50%" text-anchor="middle">'
      + 'James Bowden'
      + '</textPath>'
      + '</text>'
      + '</svg>';

    var iconsHtml = '<div class="social-icons">'
      + '<a href="mailto:jcbowden@berkeley.edu" title="Email"><i class="fas fa-envelope"></i></a>'
      + '<a href="https://scholar.google.com/citations?user=lfSNrMUAAAAJ&amp;hl=en&amp;oi=ao" title="Google Scholar"><i class="fas fa-graduation-cap"></i></a>'
      + '<a href="https://www.linkedin.com/in/j-bowden/" title="LinkedIn"><i class="fab fa-linkedin"></i></a>'
      + '<a href="https://github.com/james-bowden" title="GitHub"><i class="fab fa-github"></i></a>'
      + '</div>';

    // Inject SVG + icons at the top of the sidebar header.
    header.insertAdjacentHTML('afterbegin', svgHtml + iconsHtml);

    // Only hide JTD's default logo element AFTER we've successfully injected our own.
    var siteTitle = header.querySelector('a.site-title');
    if (siteTitle) siteTitle.style.display = 'none';
  }

  // Run after DOM is ready; also handle the case where the event already fired.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', injectSidebar);
  } else {
    injectSidebar();
  }
</script>
