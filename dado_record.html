<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DADO animation — local preview &amp; recorder</title>
<style>
  body{margin:0;padding:20px;background:#222;font-family:sans-serif;color:#eee;}
  h2{margin:0 0 12px;font-size:13px;font-weight:normal;color:#888;}
  canvas{display:block;width:800px;height:auto;border-radius:8px;}
  #controls{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  button{padding:5px 16px;font-size:12px;cursor:pointer;border:1px solid #555;
         border-radius:4px;background:#333;color:#eee;}
  button:disabled{opacity:0.5;cursor:default;}
  #status{font-size:11px;color:#aaa;}
  a{color:#7af;}
</style>
</head>
<body>
<h2>DADO animation — local preview &amp; recorder (open in Chrome)</h2>
<canvas id="dado-canvas" width="800" height="600"></canvas>
<div id="controls">
  <button id="rec-btn">&#9679;&nbsp;Record one loop (~9 s)</button>
  <span id="status">Animation should be playing above. Click Record to capture a loop.</span>
  <a id="dl" style="display:none;"></a>
</div>

<!-- Animation (same file used by the blog post) -->
<script src="assets/js/dado-anim.js"></script>

<!-- Recording-only logic -->
<script>
(function(){
  var DURATION=12000;// LEAD(1s) + animation(11s)
  var btn=document.getElementById('rec-btn');
  var status=document.getElementById('status');
  var dl=document.getElementById('dl');
  var cv=document.getElementById('dado-canvas');

  btn.addEventListener('click',function(){
    if(!cv.captureStream){
      alert('captureStream not supported — open this file in Chrome or Edge.');
      return;
    }
    btn.disabled=true;
    var mime='video/webm;codecs=vp9';
    var chunks=[];
    var mr=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:4000000});
    mr.ondataavailable=function(e){if(e.data.size)chunks.push(e.data);};
    mr.onstop=function(){
      var url=URL.createObjectURL(new Blob(chunks,{type:mime}));
      dl.href=url;dl.download='dado_animation.webm';
      dl.style.display='inline';dl.textContent='\u2b07 dado_animation.webm';
      btn.disabled=false;
      status.textContent='Done. Then run: ffmpeg -i dado_animation.webm -c:v libx264 -pix_fmt yuv420p dado_animation.mp4';
    };
    var elapsed=0;
    var iv=setInterval(function(){
      elapsed+=200;
      var rem=Math.ceil((DURATION+500-elapsed)/1000);
      status.textContent='Recording\u2026 '+rem+'s remaining';
      if(elapsed>=DURATION+500)clearInterval(iv);
    },200);
    mr.start();
    setTimeout(function(){mr.stop();},DURATION+500);
  });
})();
</script>
</body>
</html>
